<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server self-test, Renewal Decision Brief</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2314213d'/%3E%3Crect x='7' y='9' width='18' height='4' fill='%23ffe873'/%3E%3Crect x='7' y='16' width='18' height='2.5' fill='%23fff'/%3E%3Crect x='7' y='21' width='11' height='2.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; font-display: swap; src: url(/vendor/fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2"); }
  :root { color-scheme: light; }
  body { font: 16px/1.55 "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f3f5fa; color: #15203b; }
  .bar { background: linear-gradient(90deg, #073439, #05272c); color: #fff; padding: 14px 24px; font-weight: 700; }
  .bar a { color: #fff; text-decoration: none; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 24px 56px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 16px; color: #3f4960; }
  a { color: #2141c4; }
  .card { background: #fff; border: 1px solid #dbe0e8; border-radius: 12px; padding: 22px; margin-top: 24px; box-shadow: 0 1px 2px rgba(16,26,58,.05), 0 6px 20px rgba(16,26,58,.05); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid #073439; background: #073439; color: #fff; cursor: pointer; }
  button:hover { background: #0a4a51; }
  button[disabled] { opacity: .5; cursor: progress; }
  pre { background: #f3f5fa; border-radius: 8px; padding: 12px; overflow: auto; font-size: 13px; white-space: pre-wrap; }
  .ok { color: #19734a; font-weight: 600; } .bad { color: #b42318; font-weight: 600; }
  ul { padding-left: 20px; margin: 8px 0; }
</style>
</head>
<body>
<div class="bar"><a href="/">Renewal Decision Brief</a></div>
<main>
  <h1>Server self-test</h1>
  <p>Runs one small, fixed contract through the live model and checks six answers, including that the quoted passage really is in the text. <a href="/">Back to the prototype</a></p>
  <div class="card">
    <strong>Server check</strong>
    <p id="health">Checking the server.</p>
    <button id="run">Run the AI self-test</button>
    <p id="status" style="margin-top:12px"></p>
    <div id="out"></div>
  </div>
</main>
<script>
  const el = (id) => document.getElementById(id);
  fetch("/api/health").then((r) => r.json()).then((h) => {
    el("health").innerHTML = h.key_configured
      ? '<span class="ok">Server is up.</span> AI key is set. Model: ' + h.model + ", effort: " + h.effort + "."
      : '<span class="bad">Server is up, but no AI key is set yet.</span>';
  }).catch(() => { el("health").innerHTML = '<span class="bad">The server did not answer.</span>'; });

  el("run").addEventListener("click", async () => {
    el("run").disabled = true;
    el("status").textContent = "Reading a small test contract with the live model. This can take up to a minute.";
    el("out").innerHTML = "";
    try {
      const r = await fetch("/api/selftest");
      const j = await r.json();
      if (j.stage === "done") {
        el("status").innerHTML = (j.ok ? '<span class="ok">Passed ' : '<span class="bad">Passed ') + j.passed + " of " + j.of + " checks.</span> " +
          (j.meta ? "Model " + j.meta.model + ", " + (j.meta.ms / 1000).toFixed(1) + " s, " + j.meta.input_tokens + " tokens in, " + j.meta.output_tokens + " out." : "");
        el("out").innerHTML = "<ul>" + j.checks.map((c) => "<li>" + (c.pass ? "✓ " : "✗ ") + c.name + (c.pass ? "" : " (got: " + String(c.got) + ")") + "</li>").join("") + "</ul>";
      } else {
        el("status").innerHTML = '<span class="bad">Not working yet.</span>';
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(j, null, 2);
        el("out").appendChild(pre);
      }
    } catch (e) {
      el("status").innerHTML = '<span class="bad">The request failed.</span>';
      const pre = document.createElement("pre");
      pre.textContent = String(e);
      el("out").appendChild(pre);
    }
    el("run").disabled = false;
  });
</script>
</body>
</html>
